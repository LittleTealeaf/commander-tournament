name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt
      - name: Format
        uses: actions-rust-lang/rustfmt@4066006ec54a31931b9b1fddfd38f2fdf2d27143 # v1.0.0
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Clippy
        uses: LittleTealeaf/github-actions/cargo-clippy@fc00c17f2ac5588508e724282b83cf402cb1624f
  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, winows-11-arm]
    runs-on: ${{matrix.os}}
    env:
      RUSTFLAGS: "-A warnings"
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        toolchain: stable
    - name: Run tests
      run: cargo test --all --verbose
  test-coverage:
    name: Test Coverage
    strategy:
      matrix:
        workspace: [app, edh_tourn]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Cargo Test Coverage
        uses: LittleTealeaf/github-actions/cargo-test-coverage@539eabcff16e31095f939e9f33df5d19f1a71237
        with:
          workspace: ${{matrix.workspace}}
  audit:
    name: Audit Cargo Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.1.0
        name: Audit Rust Dependencies
        with:
          createIssues: ${{ github.ref == 'refs/heads/main' }}
