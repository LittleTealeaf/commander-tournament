name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        components: clippy, rustfmt
    - name: Install Clippy-Sarif
      uses: baptiste0928/cargo-install@v3
      with:
        crate: clippy-sarif
    - name: Install Sarif-fmt
      uses: baptiste0928/cargo-install@v3
      with:
        crate: sarif-fmt
    - name: Run rust-clippy
      run: cargo clippy --all --no-deps --all-features --message-format=json -- -W clippy::todo | sort | uniq | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
      continue-on-error: true
    - name: Upload analysis results to GitHub
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: rust-clippy-results.sarif
        wait-for-processing: true
    - name: Check Formatting
      uses: actions-rust-lang/rustfmt@v1

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        components: clippy, rustfmt, llvm-tools
    - name: Install Cargo LLVM Cov
      uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-llvm-cov
    - name: Run Code Coverage
      run: cargo llvm-cov test --no-fail-fast --all --all-features >> $GITHUB_STEP_SUMMARY

  build:
    name: Build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, windows-11-arm]

    runs-on: ${{matrix.os}}
    env:
      RUSTFLAGS: "-A warnings"
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
    - name: Run tests
      run: cargo test --all --verbose
    - name: Build
      run: cargo build --all --verbose --release
    - name: Upload Release Artifact
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v7
      with:
        name: "commander-tournaemnt-${{ matrix.os }}"
        path: |
          target/release/commander-tournament
          target/release/commander-tournament.exe
