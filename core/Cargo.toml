[package]
name = "commander_tournament_core"
version = "1.2.0"
edition = "2024"
authors.workspace = true
repository.workspace = true

[features]
dev = ["dep:rand", "dep:rand_chacha", "dep:ron"]

[dependencies]
itertools = "0.15.0"
serde = {version="1.0.228", features=["derive"]}
thiserror = "2.0.18"
ron = { version = "0.12.1", optional = true }
backwards-compat = { git = "https://github.com/LittleTealeaf/backwards-compat", tag = "v1.2.0" }
rand = {version = "0.10.1", optional=true}
rand_chacha = {version="0.10.0", optional=true}
derive_more = {version = "2", features = ["from", "constructor", "display"]}
im = "15.1.0"
getset = "0.1.7"
ordered-float = "5.5.0"
strum = { version = "0.28.0", features = ["derive"] }
log = "0.4.34"
serde-inline-default = "1.0.3"

[dev-dependencies]
commander_tournament_core = {path=".", features=["dev"]}
anyhow = "1.0.100"
toml = "1.1.2"
serde_json = "1.0.150"
approx = "0.5.1"

[lints]
workspace = true
