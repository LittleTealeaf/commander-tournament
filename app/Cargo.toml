[package]
name = "app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "commander-tournament"
path = "src/main.rs"

[features]
dev = []

[dependencies]
anyhow = "1.0.100"
appconfig = "0.2.1"
async-fs = "2.2.0"
iced = "0.14.0"
itertools = "0.14.0"
opener = "0.8.4"
rfd = "0.17.2"
serde = {version="1.0.228"}
serde_json = "1.0.149"
ron = "0.12.0"
toml = "1.0.6"
thiserror = "2.0.18"
edh_tourn = {path = "../edh_tourn/"}
directories = "6.0.0"

[dev-dependencies]
app = {path = ".", features = ["dev"]}
tempfile = "3.26.0"
tokio = {version = "1.50.0", features=["rt", "macros"]}
edh_tourn = {path = "../edh_tourn/", features=["dev"]}
approx = "0.5.1"

[lints]
workspace = true
